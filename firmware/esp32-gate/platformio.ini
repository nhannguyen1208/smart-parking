; Sketch gộp 1 file: parkwise_gate/parkwise_gate.ino
; Arduino IDE: mở file đó → Upload
; CLI: cd firmware/esp32-gate && pio run -t upload

[platformio]
src_dir = parkwise_gate
include_dir = parkwise_gate

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  miguelbalboa/MFRC522@^1.4.11
  madhephaestus/ESP32Servo@^3.0.6
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^6.21.5
build_flags =
  -DLOCAL_DEMO_OPEN=0
; Nếu board không tự nhận cổng:
; upload_port = /dev/cu.usbserial-XXXX
; monitor_port = /dev/cu.usbserial-XXXX
